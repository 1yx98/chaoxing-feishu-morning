name: 课前提醒

on:
  schedule:
    # 每5分钟检查一次，周一至周五上课时段
    # 北京时间 08:00-19:55 = UTC 00:00-11:55（周一至周五）
    - cron: '*/5 0-11 * * 1-5'
    # 北京时间 07:00-07:55 = UTC 23:00-23:55（周日至周四）
    - cron: '*/5 23 * * 0-4'
  workflow_dispatch:
    inputs:
      test_date:
        description: '测试日期（格式：YYYY-MM-DD HH:MM，如 2026-05-15 08:05）'
        required: false
        default: ''

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 检查课前提醒
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          TERM_START_DATE: ${{ secrets.TERM_START_DATE }}
          TEST_DATE: ${{ github.event.inputs.test_date }}
        run: python src/class_reminder.py