name: 课前提醒

on:
  schedule:
    # 每5分钟检查一次，周一至周五上课时段
    # 北京时间 07:00-19:55 = UTC 23:00-11:55（周日-周四 UTC）
    # 周五（北京）= UTC 周四23:00 ~ 周五11:55，所以 UTC 周日-周五
    - cron: '*/5 23-23,0-11 * * 0-5'
  workflow_dispatch:
    inputs:
      test_date:
        description: '测试日期（格式：YYYY-MM-DD HH:MM，如 2026-05-15 08:05）'
        required: false
        default: ''

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 检查课前提醒
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          TERM_START_DATE: ${{ secrets.TERM_START_DATE }}
          TEST_DATE: ${{ github.event.inputs.test_date }}
        run: python src/class_reminder.py