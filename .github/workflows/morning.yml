name: 早安推送

on:
  schedule:
    - cron: '7 22 * * *'  # UTC 22:07 = 北京时间次日 6:07（错开整点高峰，降低延迟）
  workflow_dispatch:
    inputs:
      TEST_DATE:
        description: '测试日期（留空=真实时间，格式: 2026-05-15）'
        required: false
        default: ''

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行早安任务
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          TERM_START_DATE: ${{ secrets.TERM_START_DATE }}
          WEATHER_CITY_ID: ${{ secrets.WEATHER_CITY_ID || '101110106' }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          TEST_DATE: ${{ github.event.inputs.TEST_DATE }}
        run: python src/main.py

  # 早间课前提醒：利用早安推送已证明可靠的 cron，顺带启动课前提醒长驻进程
  morning-reminder:
    needs: morning
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 课前提醒长驻进程
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          TERM_START_DATE: ${{ secrets.TERM_START_DATE }}
        run: python src/class_reminder_loop.py