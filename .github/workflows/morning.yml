name: 早安推送

on:
  schedule:
    - cron: '30 21 * * *'   # 主触发：UTC 21:30 = 北京时间 5:30（提前触发，应对GitHub调度延迟）
    - cron: '0 22 * * *'    # 备用触发：UTC 22:00 = 北京时间 6:00
  workflow_dispatch:
    inputs:
      TEST_DATE:
        description: '测试日期（留空=真实时间，格式: 2026-05-15）'
        required: false
        default: ''

# 防止主备触发同时运行导致重复推送
concurrency:
  group: morning-push
  cancel-in-progress: true

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行早安任务
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          TERM_START_DATE: ${{ secrets.TERM_START_DATE }}
          WEATHER_CITY_ID: ${{ secrets.WEATHER_CITY_ID || '101110106' }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          TEST_DATE: ${{ github.event.inputs.TEST_DATE }}
        run: |
          LOG_FILE="morning-$(date +%Y-%m-%d).log"
          echo "日志文件: $LOG_FILE"
          python src/main.py 2>&1 | tee "$LOG_FILE"
          echo "LOG_FILE=$LOG_FILE" >> $GITHUB_ENV
      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-log-${{ github.run_id }}
          path: ${{ env.LOG_FILE }}
          retention-days: 30
